<!doctype html>
<html lang="%salsa.lang%" data-theme-choice="%salsa.theme%" data-page-epoch="%salsa.epoch%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<script>
			/*
			 * Before the first paint, so nothing flashes the wrong colours.
			 *
			 * The theme: `data-theme-choice` (Settings, `$lib/theme/scheme.ts`)
			 * becomes `data-theme="light|dark"`, which layout.css reads. System
			 * follows `prefers-color-scheme`, live. The Android shell hears the
			 * result (`SalsaBars`) to colour the navigation bar's icons; `data-bars`
			 * ("dark": the root layout, a group's view's filled tab bar) overrides it.
			 *
			 * The insets: the Android shell draws the page under the system bars
			 * and leaves their sizes in `window.appInsets` (top, bottom, left, right in
			 * CSS px), which become `--safe-*`. In a browser
			 * those fall back to `env(safe-area-inset-*)` (layout.css).
			 */
			(function () {
				var root = document.documentElement;
				var dark = matchMedia('(prefers-color-scheme: dark)');
				window.salsaTheme = function () {
					var choice = root.dataset.themeChoice;
					var scheme =
						choice === 'light' || choice === 'dark' ? choice : dark.matches ? 'dark' : 'light';
					root.dataset.theme = scheme;
					// A group's view fills the tab bar with the band: light icons over it.
					var bars = root.dataset.bars === 'dark' ? 'dark' : scheme;
					if (window.SalsaBars) window.SalsaBars.postMessage(bars);
				};
				window.salsaTheme();
				dark.addEventListener('change', window.salsaTheme);
				window.applyAppInsets = function () {
					var insets = window.appInsets;
					if (!insets) return;
					for (var side in insets) root.style.setProperty('--safe-' + side, insets[side] + 'px');
				};
				window.applyAppInsets();

				/*
				 * The page epoch (`$lib/page-epoch.ts`): every same-origin fetch says
				 * which page sent it, in `x-page-epoch`. Wrapped here, before any
				 * module loads, because SvelteKit keeps its own reference to `fetch`.
				 * A server that refuses an older page answers 409 with `x-page-stale`;
				 * that becomes `salsa:stale` on window, which the root layout hears.
				 * A listener that cancels it holds the answer back from the caller,
				 * which then never hears it (the page is going away, or SvelteKit
				 * would swap the page for its error page).
				 */
				var epoch = root.dataset.pageEpoch;
				var send = window.fetch;
				if (!send || !/^\d+$/.test(epoch || '')) return;
				window.fetch = function (input, init) {
					var url;
					try {
						url = new URL(input instanceof Request ? input.url : String(input), location.href);
					} catch (e) {
						return send.call(window, input, init);
					}
					if (url.origin !== location.origin) return send.call(window, input, init);
					var headers = new Headers(
						init && init.headers
							? init.headers
							: input instanceof Request
								? input.headers
								: undefined
					);
					headers.set('x-page-epoch', epoch);
					return send
						.call(window, input, Object.assign({}, init, { headers: headers }))
						.then(function (res) {
							if (!res.headers.has('x-page-stale')) return res;
							var told = new CustomEvent('salsa:stale', {
								cancelable: true,
								detail: { url: url.href }
							});
							return window.dispatchEvent(told) ? res : new Promise(function () {});
						});
				};
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
